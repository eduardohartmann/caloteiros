name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write # necessário para o Actions commitar na branch deploy

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # main → raiz (prod); dev → subpasta dev/ (preview)
      - name: Definir ambiente
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=/caloteiros/" >> "$GITHUB_OUTPUT"
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/caloteiros/dev/" >> "$GITHUB_OUTPUT"
            echo "dest=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          DEPLOY_BASE: ${{ steps.env.outputs.base }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy para branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          destination_dir: ${{ steps.env.outputs.dest }}
          keep_files: true # dev e prod coexistem sem se apagar
